<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/signup.css">
    <title>SIGN UP PAGE</title>
</head>
<body>
<header>
   <div class="navigation">
    <img src="/static/image/Logo company.png" alt="Gym Bro Logo" class="logocompany" >
    <p class="title">GoFit or GoHome</p>
    <a href="/" class="btn-homepage">HOME</a>
   </div>
</header>

<main>
<div class="signup-container">
        <h2>GYM BRO SIGN UP</h2>
        <form action="/signup" method="post">

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="input-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <button type="submit" class="signup-button">SIGN UP</button>
        </form>
        
        <a href="login.html" class="login">Already have an account? Login</a>
    </div>
</main>
    
</body>
</html>
